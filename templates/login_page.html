<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>로그인 (프로토타입)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 40px; }
    .card { max-width: 420px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    label { display:block; margin: 12px 0 6px; font-size: 14px; color: #374151; }
    input { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; }
    button { width:100%; padding:12px; border:0; border-radius:10px; margin-top:16px; cursor:pointer; font-weight:600; }
    .btn-primary { background:#111827; color:white; }
    .btn-outline { background:white; border:1px solid #d1d5db; }
    .btn-google { background:#db4437; color:white; }
    .muted { color:#6b7280; font-size:13px; margin-top:10px; }
    .ok { color:#065f46; }
    .err { color:#b91c1c; }
    pre { background:#f9fafb; border:1px solid #e5e7eb; border-radius:8px; padding:10px; overflow:auto; font-size:12px; }
  </style>
</head>
<body>

  <h1>로그인 (프로토타입)</h1>
  <p class="muted">프로토타입 사용자와 비교하여 로그인하고, 성공 시 JWT를 발급합니다.</p>

  <div class="card">
    <!-- 기존 프로토타입 로그인 -->
    <form id="loginForm">
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" placeholder="test@example.com" required />

      <label for="name">이름</label>
      <input id="name" name="name" type="text" placeholder="Tester" required />

      <button class="btn-primary" type="submit">프로토타입 로그인</button>
    </form>

    <!-- ✅ 구글 로그인 버튼 추가 -->
    <button id="googleLogin" class="btn-google">Google 계정으로 로그인</button>

    <button id="callProfile" class="btn-outline" style="margin-top:8px;">/profile 호출(토큰 필요)</button>

    <div id="msg" class="muted" style="min-height: 20px;"></div>

    <h3>응답</h3>
    <pre id="resBox">{}</pre>

    <h3>저장된 토큰(localStorage)</h3>
    <pre id="tokenBox">(없음)</pre>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const resBox = document.getElementById('resBox');
    const msg = document.getElementById('msg');
    const tokenBox = document.getElementById('tokenBox');
    const callProfileBtn = document.getElementById('callProfile');
    const googleLoginBtn = document.getElementById('googleLogin');

    function setMsg(text, ok=false) {
      msg.textContent = text;
      msg.className = ok ? 'ok' : 'err';
    }
    function refreshTokenView() {
      const t = localStorage.getItem('jwt_token');
      tokenBox.textContent = t || '(없음)';
    }
    refreshTokenView();

    // 프로토타입 로그인
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      setMsg('', true);
      resBox.textContent = '{}';

      const email = document.getElementById('email').value.trim();
      const name  = document.getElementById('name').value.trim();

      try {
        const res = await fetch('/auth/login-func', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, name })
        });
        const data = await res.json();
        resBox.textContent = JSON.stringify(data, null, 2);

        if (!res.ok || data.ok === false) {
          setMsg(data.error || '로그인 실패', false);
          localStorage.removeItem('jwt_token');
        } else {
          setMsg('로그인 성공! 토큰이 저장되었습니다.', true);
          localStorage.setItem('jwt_token', data.token);
        }
        refreshTokenView();
      } catch (err) {
        setMsg('요청 중 오류가 발생했습니다.', false);
      }
    });

    // 구글 로그인 버튼 → 서버로 redirect
    googleLoginBtn.addEventListener('click', () => {
      window.location.href = '/auth/google/login';
    });

    // 프로필 호출
    callProfileBtn.addEventListener('click', async () => {
      setMsg('', true);
      resBox.textContent = '{}';

      const token = localStorage.getItem('jwt_token');
      if (!token) {
        setMsg('토큰이 없습니다. 먼저 로그인하세요.', false);
        return;
      }
      try {
        const res = await fetch('/profile', {
          method: 'GET',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        resBox.textContent = JSON.stringify(data, null, 2);
        if (!res.ok || data.ok === false) {
          setMsg('프로필 호출 실패(토큰 오류 가능).', false);
        } else {
          setMsg('프로필 호출 성공.', true);
        }
      } catch (err) {
        setMsg('요청 중 오류가 발생했습니다.', false);
      }
    });
  </script>
</body>
</html>
