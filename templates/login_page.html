<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>로그인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 40px; background-color: #f9fafb; color: #111827; }
    .container { max-width: 420px; margin: auto; }
    .card { background-color: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,.05), 0 2px 4px -2px rgba(0,0,0,.05); }
    label { display:block; margin: 12px 0 6px; font-size: 14px; font-weight: 500; color: #374151; }
    input { width:100%; box-sizing: border-box; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; }
    button { width:100%; padding:12px; border:0; border-radius:10px; margin-top:16px; cursor:pointer; font-weight:600; font-size: 15px; transition: background-color 0.2s; }
    .btn-primary { background:#111827; color:white; }
    .btn-primary:hover { background:#374151; }
    .btn-outline { background:white; border:1px solid #d1d5db; color: #374151; }
    .btn-outline:hover { background-color: #f9fafb; }
    .btn-google { background:#db4437; color:white; }
    .btn-google:hover { background:#c53727; }
    .btn-kakao { background:#FEE500; color:#191919; }
    .btn-kakao:hover { background:#f0d900; }
    .btn-naver { background:#03C75A; color:white; }
    .btn-naver:hover { background:#02b350; }
    .divider { margin: 24px 0; border-top: 1px solid #e5e7eb; }
    .muted { color:#6b7280; font-size:13px; margin-top:10px; }
    .ok { color:#065f46; }
    .err { color:#b91c1c; }
    pre { background:#f9fafb; border:1px solid #e5e7eb; border-radius:8px; padding:10px; overflow:auto; font-size:12px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>로그인</h1>
    <p class="muted">로그인 후 JWT를 발급받아 서비스를 이용해보세요.</p>

    <div class="card">
      <form id="loginForm">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" placeholder="test@example.com" required />

        <label for="name">이름</label>
        <input id="name" name="name" type="text" placeholder="홍길동" required />

        <button class="btn-primary" type="submit">로그인</button>
      </form>

      <!-- ✨ 회원가입 버튼 추가 -->
      <button id="signupButton" class="btn-outline">회원가입</button>

      <div class="divider"></div>

      <!-- 소셜 로그인 버튼 -->
      <button id="googleLogin" class="btn-google">Google 계정으로 로그인</button>
      <button id="kakaoLogin" class="btn-kakao">Kakao 계정으로 로그인</button>
      <button id="naverLogin" class="btn-naver">Naver 계정으로 로그인</button>
      
      <div id="msg" class="muted" style="min-height: 20px; margin-top: 16px;"></div>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h3>API 테스트</h3>
        <button id="callProfile" class="btn-outline" style="margin-top:8px;">/profile 호출 (토큰 필요)</button>
        <h4>응답</h4>
        <pre id="resBox">{}</pre>
        <h4>저장된 토큰 (localStorage)</h4>
        <pre id="tokenBox">(없음)</pre>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const resBox = document.getElementById('resBox');
    const msg = document.getElementById('msg');
    const tokenBox = document.getElementById('tokenBox');
    const callProfileBtn = document.getElementById('callProfile');
    const googleLoginBtn = document.getElementById('googleLogin');
    const kakaoLoginBtn  = document.getElementById('kakaoLogin');
    const naverLoginBtn = document.getElementById('naverLogin');
    
    // ✨ 회원가입 버튼 변수 추가
    const signupButton = document.getElementById('signupButton');

    function setMsg(text, ok=false) {
      msg.textContent = text;
      msg.className = ok ? 'ok' : 'err';
    }
    function refreshTokenView() {
      const t = localStorage.getItem('jwt_token');
      tokenBox.textContent = t || '(없음)';
    }
    refreshTokenView();

    // 일반 로그인
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      setMsg('', true);
      resBox.textContent = '{}';

      const email = document.getElementById('email').value.trim();
      const name  = document.getElementById('name').value.trim();

      try {
        const res = await fetch('/auth/login-func', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, name })
        });
        const data = await res.json();
        resBox.textContent = JSON.stringify(data, null, 2);

        if (!res.ok || data.ok === false) {
          setMsg(data.error || '로그인 실패', false);
          localStorage.removeItem('jwt_token');
        } else {
          setMsg('로그인 성공! 토큰이 저장되었습니다.', true);
          localStorage.setItem('jwt_token', data.token);
        }
        refreshTokenView();
      } catch (err) {
        setMsg('요청 중 오류가 발생했습니다.', false);
      }
    });

    // ✨ 회원가입 버튼 클릭 이벤트
    signupButton.addEventListener('click', () => {
        window.location.href = '/signup';
    });

    // 구글 로그인
    googleLoginBtn.addEventListener('click', () => {
      window.location.href = '/auth/google/login';
    });

    // 카카오 로그인
    kakaoLoginBtn.addEventListener('click', () => {
      window.location.href = '/auth/kakao/login';
    });

    // 네이버 로그인
    naverLoginBtn.addEventListener('click', () => {
        window.location.href = '/auth/naver/login';
    });

    // 프로필 호출 (API 테스트)
    callProfileBtn.addEventListener('click', async () => {
      setMsg('', true);
      resBox.textContent = '{}';
      const token = localStorage.getItem('jwt_token');
      if (!token) {
        setMsg('토큰이 없습니다. 먼저 로그인하세요.', false);
        return;
      }
      try {
        const res = await fetch('/profile', {
          method: 'GET',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        resBox.textContent = JSON.stringify(data, null, 2);
        if (!res.ok || data.ok === false) {
          setMsg('프로필 호출 실패(토큰 오류 가능).', false);
        } else {
          setMsg('프로필 호출 성공.', true);
        }
      } catch (err) {
        setMsg('요청 중 오류가 발생했습니다.', false);
      }
    });
  </script>
</body>
</html>
